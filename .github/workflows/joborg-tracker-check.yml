name: Joborg Tracker Check

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "America/St_Johns"

  workflow_dispatch:

jobs:
  trigger-tracker-check:
    runs-on: ubuntu-latest

    steps:
      - name: Wake backend
        run: |
          for i in 1 2 3 4 5; do
            echo "Wake attempt $i"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://joborg-backend.onrender.com/api/v1/health")
            echo "Health status: $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Backend is awake"
              break
            fi

            sleep 30
          done

      - name: Run tracker check
        run: |
          for i in 1 2 3 4 5; do
            echo "Tracker check attempt $i"

            STATUS=$(curl -s -o response.txt -w "%{http_code}" \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              "https://joborg-backend.onrender.com/api/v1/cron-jobs")

            echo "Status: $STATUS"
            cat response.txt || true

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "202" ]; then
              echo "Tracker check started successfully"
              exit 0
            fi

            sleep 30
          done

          echo "Tracker check failed after retries"
          exit 1
